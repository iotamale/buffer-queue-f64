name: CI/CD Pipeline

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']
    release:
        types: [published]

jobs:
    test:
        name: Run Tests & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run Tests
              run: npm run test

            - name: Test Build
              run: npm run build

    publish:
        name: Publish to NPM
        needs: test
        if: github.event_name == 'release'
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.x'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Build package
              run: npm run build

            - name: Publish to NPM with Provenance
              run: npm publish --provenance --access public
